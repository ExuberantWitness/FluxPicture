<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FluxPicture - 图表标注</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; height: 100vh; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap; }
.toolbar button { background: #0f3460; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
.toolbar button:hover { background: #1a5276; }
.toolbar button.active { background: #e94560; border-color: #e94560; }
.toolbar .sep { width: 1px; height: 28px; background: #444; margin: 0 4px; }
.toolbar .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #555; padding: 0; }
.toolbar .color-btn.active { border-color: #fff; box-shadow: 0 0 6px #fff; }
.toolbar .done-btn { background: #10b981; color: #fff; border: none; margin-left: auto; padding: 8px 24px; font-weight: bold; font-size: 14px; }
.toolbar .done-btn:hover { background: #059669; }
.main-area { flex: 1; display: flex; overflow: hidden; }
.canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; }
canvas { cursor: crosshair; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.comments-panel { width: 300px; background: #16213e; border-left: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
.comments-header { padding: 12px 16px; border-bottom: 1px solid #333; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.comments-header .badge { background: #e94560; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 12px; min-width: 20px; text-align: center; }
.comments-list { flex: 1; overflow-y: auto; padding: 8px; }
.comment-item { background: #0f3460; border: 1px solid #2a4a7f; border-radius: 8px; padding: 10px; margin-bottom: 8px; position: relative; }
.comment-item:hover { border-color: #3b82f6; }
.comment-item .comment-pin { display: inline-block; background: #e94560; color: #fff; border-radius: 50%; width: 24px; height: 24px; text-align: center; line-height: 24px; font-size: 12px; font-weight: bold; margin-right: 8px; vertical-align: top; }
.comment-item textarea { width: calc(100% - 36px); background: #1a2744; border: 1px solid #2a4a7f; border-radius: 4px; color: #eee; padding: 6px 8px; font-size: 13px; font-family: 'Microsoft YaHei', sans-serif; resize: vertical; min-height: 48px; outline: none; }
.comment-item textarea:focus { border-color: #3b82f6; }
.comment-item .del-btn { position: absolute; top: 6px; right: 6px; background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 2px 6px; }
.comment-item .del-btn:hover { color: #e94560; }
.comment-item .coord { font-size: 11px; color: #666; margin-top: 4px; padding-left: 32px; }
.comments-empty { text-align: center; color: #555; padding: 40px 20px; font-size: 13px; line-height: 1.8; }
.info-bar { padding: 6px 16px; background: #16213e; border-top: 1px solid #333; font-size: 12px; color: #888; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="btn-pen" class="active" onclick="setTool('pen')">画笔</button>
  <button id="btn-arrow" onclick="setTool('arrow')">箭头</button>
  <button id="btn-rect" onclick="setTool('rect')">矩形</button>
  <button id="btn-comment" onclick="setTool('comment')">评论</button>
  <button id="btn-eraser" onclick="setTool('eraser')">橡皮</button>
  <div class="sep"></div>
  <button class="color-btn active" style="background:#ef4444" onclick="setColor('#ef4444',this)" title="红色"></button>
  <button class="color-btn" style="background:#3b82f6" onclick="setColor('#3b82f6',this)" title="蓝色"></button>
  <button class="color-btn" style="background:#22c55e" onclick="setColor('#22c55e',this)" title="绿色"></button>
  <button class="color-btn" style="background:#f59e0b" onclick="setColor('#f59e0b',this)" title="黄色"></button>
  <button class="color-btn" style="background:#ffffff" onclick="setColor('#ffffff',this)" title="白色"></button>
  <div class="sep"></div>
  <button onclick="undo()">撤销</button>
  <button onclick="redo()">重做</button>
  <button onclick="clearAll()">清空标注</button>
  <button class="done-btn" onclick="submit()">完成标注</button>
</div>
<div class="main-area">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="cvs"></canvas>
  </div>
  <div class="comments-panel" id="commentsPanel">
    <div class="comments-header">
      <span>评论标注</span>
      <span class="badge" id="commentCount">0</span>
    </div>
    <div class="comments-list" id="commentsList">
      <div class="comments-empty" id="commentsEmpty">
        选择"评论"工具后<br>点击图上的位置<br>添加评论标注
      </div>
    </div>
  </div>
</div>
<div class="info-bar">
  <span id="info">加载中...</span>
  <span>画笔粗细: <input type="range" id="lineWidth" min="2" max="12" value="4" style="vertical-align:middle"> <span id="lwVal">4</span>px</span>
</div>
<script>
const canvas = document.getElementById('cvs');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
let img = new Image();
let baseImgData = null;
let tool = 'pen', color = '#ef4444', lw = 4;
let drawing = false, startX, startY;
let history = [], redoStack = [];
let comments = [];
let commentIdCounter = 0;
let baseStateForComments = null; // canvas state without comments

const params = new URLSearchParams(location.search);
const imgPath = params.get('image');

document.getElementById('lineWidth').oninput = function() {
  lw = +this.value;
  document.getElementById('lwVal').textContent = lw;
};

img.onload = function() {
  const maxW = window.innerWidth - 340;
  const maxH = window.innerHeight - 140;
  let w = img.width, h = img.height;
  if (w > maxW) { h = h * maxW / w; w = maxW; }
  if (h > maxH) { w = w * maxH / h; h = maxH; }
  canvas.width = w; canvas.height = h;
  ctx.drawImage(img, 0, 0, w, h);
  baseImgData = ctx.getImageData(0, 0, w, h);
  baseStateForComments = canvas.toDataURL('image/png');
  document.getElementById('info').textContent = '图片: ' + img.width + 'x' + img.height + ' | 画布: ' + Math.round(w) + 'x' + Math.round(h);
};
if (imgPath) img.src = '/image?path=' + encodeURIComponent(imgPath);

function saveState() {
  history.push(canvas.toDataURL('image/png'));
  redoStack = [];
  if (history.length > 50) history.shift();
}

function undo() {
  if (!history.length) return;
  redoStack.push(canvas.toDataURL('image/png'));
  restoreFrom(history.pop());
  baseStateForComments = history.length ? history[history.length - 1] : canvas.toDataURL('image/png');
}

function redo() {
  if (!redoStack.length) return;
  history.push(canvas.toDataURL('image/png'));
  restoreFrom(redoStack.pop());
  baseStateForComments = history.length ? history[history.length - 1] : canvas.toDataURL('image/png');
}

function restoreFrom(dataUrl) {
  const tmp = new Image();
  tmp.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(tmp,0,0); };
  tmp.src = dataUrl;
}

function clearAll() {
  saveState();
  comments = [];
  commentIdCounter = 0;
  ctx.putImageData(baseImgData, 0, 0);
  baseStateForComments = canvas.toDataURL('image/png');
  renderCommentsList();
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('.toolbar button[id^="btn-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + t);
  if (btn) btn.classList.add('active');
  canvas.style.cursor = t === 'eraser' ? 'cell' : t === 'comment' ? 'copy' : 'crosshair';
}

function setColor(c, el) {
  color = c;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
}

// Render all comment pins on canvas
function renderCommentsOnCanvas(callback) {
  const tmp = new Image();
  tmp.onload = () => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(tmp, 0, 0);
    comments.forEach(c => {
      drawCommentPin(c.id, c.x, c.y);
      drawCommentText(c.id, c.x, c.y, c.text);
    });
    if (callback) callback();
  };
  tmp.src = baseStateForComments;
}

function drawCommentPin(id, x, y) {
  const r = 14;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#e94560';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(id, x, y);
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function drawCommentText(id, x, y, text) {
  if (!text) return;
  const fontSize = 12;
  ctx.font = fontSize + 'px "Microsoft YaHei", sans-serif';
  const maxW = 200;
  const lines = wrapText(text, maxW);
  const lineH = fontSize + 4;
  const bx = x + 20;
  const by = y - (lines.length * lineH) / 2 - 4;
  const bw = Math.min(maxW + 12, ctx.measureText(text).width + 12);
  const bh = lines.length * lineH + 8;

  ctx.fillStyle = 'rgba(15,52,96,0.92)';
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 1;
  roundRect(ctx, bx, by, bw, bh, 6);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#eee';
  ctx.font = fontSize + 'px "Microsoft YaHei", sans-serif';
  lines.forEach((line, i) => {
    ctx.fillText(line, bx + 6, by + 6 + fontSize + i * lineH);
  });
}

function wrapText(text, maxW) {
  if (!text) return [];
  const words = text.split('');
  const lines = [];
  let line = '';
  for (const ch of words) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Comment panel rendering
function renderCommentsList() {
  const list = document.getElementById('commentsList');
  const empty = document.getElementById('commentsEmpty');
  const badge = document.getElementById('commentCount');
  badge.textContent = comments.length;

  if (!comments.length) {
    list.innerHTML = '<div class="comments-empty" id="commentsEmpty">选择"评论"工具后<br>点击图上的位置<br>添加评论标注</div>';
    return;
  }

  list.innerHTML = comments.map(c =>
    '<div class="comment-item" data-id="' + c.id + '">' +
      '<span class="comment-pin">' + c.id + '</span>' +
      '<textarea placeholder="输入修改意见..." oninput="updateComment(' + c.id + ',this.value)">' + (c.text || '') + '</textarea>' +
      '<button class="del-btn" onclick="deleteComment(' + c.id + ')" title="删除">&times;</button>' +
      '<div class="coord">位置: (' + Math.round(c.x) + ', ' + Math.round(c.y) + ')</div>' +
    '</div>'
  ).join('');
}

function updateComment(id, text) {
  const c = comments.find(c => c.id === id);
  if (c) {
    c.text = text;
    renderCommentsOnCanvas();
  }
}

function deleteComment(id) {
  comments = comments.filter(c => c.id !== id);
  renderCommentsList();
  renderCommentsOnCanvas();
}

canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  startX = e.clientX - r.left;
  startY = e.clientY - r.top;

  if (tool === 'comment') {
    commentIdCounter++;
    const c = { id: commentIdCounter, x: startX, y: startY, text: '' };
    comments.push(c);
    renderCommentsList();
    renderCommentsOnCanvas();
    setTimeout(() => {
      const item = document.querySelector('.comment-item[data-id="' + c.id + '"] textarea');
      if (item) item.focus();
    }, 100);
    return;
  }

  drawing = true;

  if (tool === 'pen' || tool === 'eraser') {
    saveState();
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
});

canvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (tool === 'pen') {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineTo(x, y); ctx.stroke();
  } else if (tool === 'eraser') {
    const sz = lw * 4;
    const sx = Math.max(0, Math.round((x - sz/2) * img.width / canvas.width));
    const sy = Math.max(0, Math.round((y - sz/2) * img.height / canvas.height));
    const sw = Math.round(sz * img.width / canvas.width);
    const sh = Math.round(sz * img.height / canvas.height);
    ctx.drawImage(img, sx, sy, sw, sh, x - sz/2, y - sz/2, sz, sz);
  } else if (tool === 'arrow') {
    const lastState = history.length ? history[history.length - 1] : null;
    const tmp = new Image();
    tmp.onload = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(tmp,0,0);
      drawArrow(startX, startY, x, y);
    };
    if (lastState) tmp.src = lastState; else drawArrow(startX, startY, x, y);
  } else if (tool === 'rect') {
    const lastState = history.length ? history[history.length - 1] : null;
    const tmp = new Image();
    tmp.onload = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(tmp,0,0);
      ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash([8,4]);
      ctx.strokeRect(startX, startY, x - startX, y - startY);
      ctx.setLineDash([]);
    };
    if (lastState) tmp.src = lastState; else { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash([8,4]); ctx.strokeRect(startX, startY, x-startX, y-startY); ctx.setLineDash([]); }
  }
});

canvas.addEventListener('mouseup', e => {
  if (!drawing) return;
  drawing = false;
  if (tool === 'pen') {
    baseStateForComments = canvas.toDataURL('image/png');
  } else if (tool === 'eraser') {
    baseStateForComments = canvas.toDataURL('image/png');
  } else if (tool === 'arrow') {
    saveState();
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const lastState = history.length >= 2 ? history[history.length - 2] : null;
    const tmp = new Image();
    tmp.onload = () => {
      ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(tmp,0,0);
      drawArrow(startX, startY, x, y);
      baseStateForComments = canvas.toDataURL('image/png');
    };
    if (lastState) tmp.src = lastState; else { drawArrow(startX, startY, x, y); baseStateForComments = canvas.toDataURL('image/png'); }
  } else if (tool === 'rect') {
    saveState();
    baseStateForComments = canvas.toDataURL('image/png');
  }
});

function drawArrow(x1, y1, x2, y2) {
  const headLen = 16;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.4), y2 - headLen * Math.sin(angle - 0.4));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.4), y2 - headLen * Math.sin(angle + 0.4));
  ctx.closePath(); ctx.fill();
}

async function submit() {
  const btn = document.querySelector('.done-btn');
  btn.textContent = '提交中...'; btn.disabled = true;

  // Final render: make sure all comments are on canvas
  await new Promise(resolve => {
    renderCommentsOnCanvas(resolve);
  });

  // Small delay for canvas to finish rendering
  await new Promise(r => setTimeout(r, 200));

  const dataUrl = canvas.toDataURL('image/png');
  try {
    const resp = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: dataUrl,
        comments: comments.map(c => ({
          id: c.id,
          x: Math.round(c.x),
          y: Math.round(c.y),
          text: c.text
        }))
      })
    });
    const result = await resp.json();
    if (result.ok) {
      document.getElementById('info').textContent = '标注已提交！可以关闭此页面。';
      btn.textContent = '已提交';
    } else {
      alert('提交失败: ' + (result.error || '未知错误'));
      btn.textContent = '完成标注'; btn.disabled = false;
    }
  } catch(e) {
    alert('提交失败: ' + e.message);
    btn.textContent = '完成标注'; btn.disabled = false;
  }
}
</script>
</body>
</html>
